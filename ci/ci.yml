name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / typecheck / test / build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fails the build if package.json and package-lock.json disagree.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: SEO audit
        run: npm run seo:audit

      - name: Production build
        run: npm run build
        env:
          APP_SECRET: ci-only-secret-not-used-at-runtime-0000

      - name: Dependency audit (production tree)
        run: npm audit --omit=dev --audit-level=high

  smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    needs: ci

    # The smoke test is read-only, but it asserts on real HTTP responses from a
    # production build backed by a real PostgreSQL. It is what found the
    # double-encoded jsonb payloads, the per-chunk store cache and the 500s on
    # / and /instructors, so it gates the same way a deploy would.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asadzedeh
          POSTGRES_PASSWORD: asadzedeh
          POSTGRES_DB: asadzedeh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asadzedeh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://asadzedeh:asadzedeh@127.0.0.1:5432/asadzedeh_ci
      APP_SECRET: ci-only-secret-not-used-at-runtime-0000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:4700

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate
        run: npm run db:migrate

      - name: Seed
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Start the production server
        run: |
          PORT=4700 HOSTNAME=0.0.0.0 nohup node server.mjs > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4700/api/health > /dev/null 2>&1; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"; cat server.log; exit 1

      - name: Smoke test
        run: npx tsx scripts/smoke.ts --base http://127.0.0.1:4700

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: server.log
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
